name: Check site
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check local assets and navigation
        run: python scripts/check_site.py
      - name: Validate HTML
        run: |
          python -m pip install html5validator==0.4.2
          html5validator --root . --match index.html
